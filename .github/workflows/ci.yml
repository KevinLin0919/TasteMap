name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test domain package
        working-directory: Packages/TasteMapCore
        run: swift test

  simulator-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Xcode project
        # project.yml 是專案結構的唯一事實來源。committed 的 .pbxproj 只是
        # 方便本機開 Xcode 用的，新增檔案時很容易忘記同步 —— 在這裡重新產生，
        # 就不會因為漏加檔案而在編譯期才發現。
        run: |
          brew install --quiet xcodegen
          xcodegen generate
      - name: Build iOS app
        run: >-
          xcodebuild
          -project TasteMap.xcodeproj
          -scheme TasteMap
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Xcode project
        # project.yml 是專案結構的唯一事實來源。committed 的 .pbxproj 只是
        # 方便本機開 Xcode 用的，新增檔案時很容易忘記同步 —— 在這裡重新產生，
        # 就不會因為漏加檔案而在編譯期才發現。
        run: |
          brew install --quiet xcodegen
          xcodegen generate
      - name: Build release app for iPhone
        run: >-
          xcodebuild
          -project TasteMap.xcodeproj
          -scheme TasteMap
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=''
          build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TasteMap.app Payload/
          zip -qry TasteMap.ipa Payload
          shasum -a 256 TasteMap.ipa > TasteMap.ipa.sha256
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TasteMap-unsigned-ipa
          path: |
            TasteMap.ipa
            TasteMap.ipa.sha256
          if-no-files-found: error
          retention-days: 14
